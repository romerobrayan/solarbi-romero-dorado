[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solarbi"
version = "0.1.0"
description = "SolarBI Pascual: solar plant telemetry pipeline (Bronze -> Silver -> Gold) for Grafana and Power BI."
requires-python = ">=3.12"
authors = [{ name = "Brayan Romero Dorado" }]
dependencies = [
    "jsonschema==4.26.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "tzdata==2026.5", # IANA time zones for zoneinfo on Windows (America/Bogota)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools]
packages = ["etl"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The professor's simulator is kept verbatim (one-line imports, aligned comments).
"etl/simulador.py" = ["E401", "I001"]

[tool.ruff.format]
exclude = ["etl/simulador.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
