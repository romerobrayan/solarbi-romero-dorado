[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solarbi"
version = "0.1.0"
description = "SolarBI Pascual: solar plant telemetry pipeline (Bronze -> Silver -> Gold) for Grafana and Power BI."
requires-python = ">=3.12"
authors = [{ name = "Brayan Romero Dorado" }]
dependencies = [
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools]
packages = ["etl"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
