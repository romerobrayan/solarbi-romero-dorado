# Dashboards as code: every JSON file in grafana/dashboards/ (mounted at
# /etc/grafana/dashboards) is loaded into the "SolarBI" folder.
# The repo stays the source of truth. UI edits are allowed while developing;
# then run "python scripts/export_grafana.py" to write the normalized JSON back
# to grafana/dashboards/ and commit it (see docs/adr/0008).
apiVersion: 1

providers:
  - name: solarbi-dashboards
    orgId: 1
    folder: SolarBI
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
