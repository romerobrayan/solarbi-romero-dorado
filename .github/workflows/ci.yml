# Lint + full test suite against a real PostgreSQL 16 + TimescaleDB.
# Every credential below is a dummy value that only exists inside the CI job.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_DB: solarbi
          POSTGRES_USER: solarbi_owner
          POSTGRES_PASSWORD: ci-owner-dummy
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5433:5432
        # TCP check: the init server listens only on the Unix socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U solarbi_owner -d solarbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Same variable names as .env (see .env.example); values are CI-only dummies.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_DB: solarbi
      POSTGRES_USER: solarbi_owner
      POSTGRES_PASSWORD: ci-owner-dummy
      GRAFANA_READER_PASSWORD: ci-grafana-reader-dummy
      POWERBI_READER_PASSWORD: ci-powerbi-reader-dummy
      ETL_WRITER_PASSWORD: ci-etl-writer-dummy
      # psql defaults for the bootstrap step
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: solarbi_owner
      PGPASSWORD: ci-owner-dummy
      PGDATABASE: solarbi
      # Database tests must run here: a skip would hide a broken setup.
      SOLARBI_REQUIRE_DB: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Bootstrap the database (same scripts as docker-entrypoint-initdb.d)
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/init/00_schemas.sql
          bash sql/init/01_roles.sh

      - name: Apply migrations
        run: python scripts/migrate.py

      - name: Check the environment
        run: python scripts/check_env.py

      - name: Tests
        run: pytest
